assembly_robot_1:
  controller_manager:
    ros__parameters:
      update_rate: 1000  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      
      joint_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      gripper_controller:
        type: robotiq_gripper_controller/RobotiqGripperController
  
  joint_trajectory_controller:
    ros__parameters:
      joints:
        - assembly_robot_1_shoulder_pan_joint
        - assembly_robot_1_shoulder_lift_joint
        - assembly_robot_1_elbow_joint
        - assembly_robot_1_wrist_1_joint
        - assembly_robot_1_wrist_2_joint
        - assembly_robot_1_wrist_3_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 1000.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: false
  
  gripper_controller:
    ros__parameters:
      joint: assembly_robot_1_robotiq_85_left_knuckle_joint